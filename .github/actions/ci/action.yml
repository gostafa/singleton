---
name: Go CI
description: Run Task-based CI, autofix issues, generate test reports, and upload coverage/results to Codecov

inputs:
  github-token:
    description: GitHub token used for automated fixes
    required: true

runs:
  using: composite
  steps:
    - name: Run CI
      shell: bash
      run: YAMLFIX_EXTRA_ARGS='--exclude ".github/workflows/**/*" --exclude "taskotter/**/*"' task taskotter:ci:fix
    - name: Create fix PR
      uses: $/.github/actions/auto-fix
      with:
        token: ${{ inputs.github-token }}
    - name: Run all CI checks
      shell: bash
      run: task taskotter:ci
    - name: Run Tests
      shell: bash
      run: task taskotter:go-junit-report:report
    - name: Set up Python for Codecov
      if: ${{ !cancelled() }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.12'
    - name: Update Codecov HTTPS dependencies
      if: ${{ !cancelled() }}
      shell: bash
      # The system Python can retain old requests, urllib3, and CA certificates.
      run: python -m pip install --upgrade requests urllib3 certifi
    - name: Upload coverage to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        use_oidc: true
        # Avoid cli.codecov.io TLS failures by installing the CLI from PyPI.
        use_pypi: true
        files: ./coverage.out
        report_type: coverage
        name: coverage-${{ runner.os }}
        flags: ${{ runner.os }}
        env_vars: RUNNER_OS
        disable_search: false
        fail_ci_if_error: true
        verbose: true
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        use_oidc: true
        # Avoid cli.codecov.io TLS failures by installing the CLI from PyPI.
        use_pypi: true
        report_type: test_results
        files: ./junit.xml
        disable_search: false
        name: go-test-results-${{ runner.os }}
        flags: ${{ runner.os }}
        env_vars: RUNNER_OS
        fail_ci_if_error: true
        verbose: true
