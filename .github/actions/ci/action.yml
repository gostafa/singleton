---
name: Go CI
description: Run Task-based CI, autofix issues, generate test reports, and upload coverage/results to Codecov

inputs:
  github-token:
    description: GitHub token used for automated fixes
    required: true

runs:
  using: composite
  steps:
    - name: Run CI
      shell: bash
      run: YAMLFIX_EXTRA_ARGS='--exclude ".github/workflows/**/*" --exclude "taskotter/**/*"' task taskotter:ci:fix
    - name: Create fix PR
      uses: $/.github/actions/auto-fix
      with:
        token: ${{ inputs.github-token }}
    - name: Run all CI checks
      shell: bash
      run: |
        task taskotter:actionlint:ci
        task taskotter:yamllint:ci
        task taskotter:zizmor:ci
        task taskotter:rumdl:ci
    - name: Run Tests
      shell: bash
      run: task taskotter:go-junit-report:report
    - name: Upload coverage to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        use_oidc: true
        files: ./coverage.out
        report_type: coverage
        name: coverage-${{ runner.os }}
        flags: ${{ runner.os }}
        env_vars: RUNNER_OS
        disable_search: false
        fail_ci_if_error: true
        verbose: true
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        use_oidc: true
        report_type: test_results
        files: ./junit.xml
        disable_search: false
        name: go-test-results-${{ runner.os }}
        flags: ${{ runner.os }}
        env_vars: RUNNER_OS
        fail_ci_if_error: true
        verbose: true
