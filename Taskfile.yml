---
version: '3.5'

includes:
  taskotter:
    taskfile: taskotter/Taskfile.yml
    vars:
      GO_JUNIT_REPORT_IN: test-result.txt
      GO_JUNIT_REPORT_OUT: junit.xml
      YAMLFIX_EXTRA_ARGS: --exclude "taskotter/**/*"

tasks:
  default:
    run: once
    desc: Show all available TaskOtter tasks
    cmds:
      - task --list-all
